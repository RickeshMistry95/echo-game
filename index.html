<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060b" />
    <meta name="description" content="Echo: survive 10-second rounds while every past run replays as a ghost that kills on contact." />
    <title>Echo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060b'/%3E%3Ccircle cx='11' cy='20' r='5' fill='none' stroke='%235db3ff' stroke-width='2'/%3E%3Ccircle cx='20' cy='13' r='5' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="hud" class="off">
        <div class="hud-left"><span id="hud-round">Round 1</span></div>
        <div class="hud-mid"><div id="hud-timer"><div id="hud-timer-fill"></div></div></div>
        <div class="hud-right"><span id="hud-combo" title="Chain coins to raise your multiplier"><span id="hud-combo-text"></span><i id="hud-combo-bar"></i></span><span id="hud-coin" class="coin-pip" title="Coin">&#9670;</span><span id="hud-ghosts"><span id="hud-ghost-n">0</span><span class="word" id="hud-ghost-word"> clones</span></span><span id="hud-points">0</span><button id="hud-pause" class="icon-btn" aria-label="Pause" hidden>||</button></div>
      </div>
      <canvas id="game" aria-label="Echo game arena"></canvas>
      <div id="banner" hidden></div>
      <div id="overlay"></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
